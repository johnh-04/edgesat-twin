[project]
name = "edgesat-twin"
version = "0.1.0"
description = "Full-spacecraft digital twin of a 6U Earth-observation CubeSat with on-board Edge AI for wildfire detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Giovanni Pio Martello" }]
dependencies = ["numpy>=1.24", "starlette>=0.37", "uvicorn>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "matplotlib>=3.7", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["edgesat*", "server*"]

[tool.setuptools.package-data]
edgesat = ["data/*", "ai/*.npz", "ai/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
